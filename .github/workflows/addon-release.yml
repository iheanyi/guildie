name: Addon release

# Daily: builds the addon with every public guild's data bundled
# (apps/addon/scripts/build.ts), keeps the zip as a workflow artifact, and
# uploads it to CurseForge and Wago when their secrets are set. Skips the
# upload when neither the data nor the addon changed since the last one.
# Setup: docs/addon.md ("Releases").
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: Site to take the guild data from
        default: https://guildie.club
      force:
        description: Upload even if nothing changed
        type: boolean
        default: false

concurrency:
  group: addon-release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Needs no install: the script uses Node's built-ins and packages/sync's luaData.ts.
      - name: Build
        id: build
        run: node apps/addon/scripts/build.ts --url "${{ inputs.url || 'https://guildie.club' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Guildie-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.zip }}
          retention-days: 30

      # A cache entry per released hash marks "already uploaded"; nothing is stored in it.
      - name: Released already?
        id: released
        uses: actions/cache/restore@v4
        with:
          path: apps/addon/dist/release.json
          key: addon-release-${{ steps.build.outputs.hash }}
          lookup-only: true

      - name: Upload to CurseForge and Wago
        id: upload
        if: steps.released.outputs.cache-hit != 'true' || inputs.force
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ secrets.CF_PROJECT_ID }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WAGO_PROJECT_ID: ${{ secrets.WAGO_PROJECT_ID }}
        run: node apps/addon/scripts/upload.ts

      - name: Remember this release
        if: steps.upload.outputs.uploaded == 'true' && steps.released.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/addon/dist/release.json
          key: addon-release-${{ steps.build.outputs.hash }}

      - name: Skipped
        if: steps.released.outputs.cache-hit == 'true' && !inputs.force
        run: echo "Nothing changed since the last upload (${{ steps.build.outputs.hash }}); not uploading."
